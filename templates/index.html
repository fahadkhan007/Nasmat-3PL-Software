<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3PL Report Generator | Al Nasmat</title>
  <meta name="description" content="Upload your daily 3PL CSV and generate a formatted PDF delivery quality report instantly." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <!-- ── Background ── -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <!-- ── Header ── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <img src="/image/companylogo.png" alt="Nasmat Al-Sharq" class="logo-img" style="max-height: 48px; width: auto; object-fit: contain;" />
        <div>
          <div class="logo-title">Nasmat Al-Sharq</div>
          <div class="logo-sub">3PL Report Generator</div>
        </div>
      </div>
      <div class="header-badge" id="status-badge">
        <span class="badge-dot"></span>
        <span id="badge-text">Ready</span>
      </div>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="main-content">

    <!-- Step 1: Upload -->
    <section class="card" id="upload-section">
      <div class="card-header">
        <span class="step-num">1</span>
        <div>
          <h2 class="card-title">Upload Daily CSV</h2>
          <p class="card-desc">Drop your 3PL delivery quality report here</p>
        </div>
      </div>

      <div
        class="dropzone"
        id="dropzone"
        role="button"
        tabindex="0"
        aria-label="Upload CSV file"
      >
        <div class="dropzone-icon" id="dz-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 16V4m0 0L8 8m4-4l4 4"/>
            <rect x="3" y="14" width="18" height="7" rx="2" stroke-opacity="0.4"/>
          </svg>
        </div>
        <div class="dropzone-text" id="dz-text">
          <strong>Drop CSV here</strong> or click to browse
        </div>
        <div class="dropzone-hint">Accepts .csv files from 3PL</div>
        <input type="file" id="file-input" accept=".csv" hidden />
      </div>

      <div class="error-box hidden" id="error-box" role="alert">
        <span class="error-icon">⚠️</span>
        <span id="error-msg"></span>
      </div>
    </section>

    <!-- Step 2: Preview -->
    <section class="card hidden" id="preview-section">
      <div class="card-header">
        <span class="step-num">2</span>
        <div class="card-header-meta">
          <div>
            <h2 class="card-title">Preview Report</h2>
            <p class="card-desc">
              <span id="month-label">—</span> &nbsp;·&nbsp;
              <span id="rider-count">0</span> riders matched
            </p>
          </div>
          <button class="btn-primary" id="download-btn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 4v12m0 0l-4-4m4 4l4-4"/>
              <path d="M4 18h16" stroke-linecap="round"/>
            </svg>
            Download PDF
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table" id="preview-table">
          <thead>
            <tr>
              <th>SR</th>
              <th>ID NO</th>
              <th class="col-name">NAMES</th>
              <th>ORDERS</th>
              <th>ON TIME</th>
              <th>PERCENT</th>
              <th>SEG</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- ── Loading overlay ── -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Processing…</div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let currentRows = null;
    let currentMonth = "";

    // ── Elements ───────────────────────────────────────────────────────────────
    const dropzone   = document.getElementById("dropzone");
    const fileInput  = document.getElementById("file-input");
    const dzText     = document.getElementById("dz-text");
    const dzIcon     = document.getElementById("dz-icon");
    const errorBox   = document.getElementById("error-box");
    const errorMsg   = document.getElementById("error-msg");
    const previewSec = document.getElementById("preview-section");
    const tableBody  = document.getElementById("table-body");
    const monthLabel = document.getElementById("month-label");
    const riderCount = document.getElementById("rider-count");
    const downloadBtn= document.getElementById("download-btn");
    const loadOverlay= document.getElementById("loading-overlay");
    const loadText   = document.getElementById("loading-text");
    const badgeText  = document.getElementById("badge-text");
    const badgeDot   = document.querySelector(".badge-dot");

    // ── Segment colours (mirrors Python dict) ─────────────────────────────────
    const SEG_STYLE = {
      A: { bg: "#22c55e", fg: "#fff" },
      B: { bg: "#86efac", fg: "#14532d" },
      C: { bg: "#fde68a", fg: "#78350f" },
      D: { bg: "#fb923c", fg: "#fff" },
      E: { bg: "#ef4444", fg: "#fff" },
      F: { bg: "#2C3A47", fg: "#fff" },
    };

    // ── Drag-and-drop ──────────────────────────────────────────────────────────
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") fileInput.click();
    });

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("drag-over");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("drag-over"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    // ── File handling ──────────────────────────────────────────────────────────
    function handleFile(file) {
      if (!file.name.toLowerCase().endsWith(".csv")) {
        showError("Please upload a .csv file.");
        return;
      }
      hideError();
      uploadFile(file);
    }

    async function uploadFile(file) {
      showLoading("Processing CSV…");
      setStatus("Processing…", "processing");

      const fd = new FormData();
      fd.append("file", file);

      try {
        const res = await fetch("/upload", { method: "POST", body: fd });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || "Upload failed.");
          setStatus("Error", "error");
          hideLoading();
          return;
        }

        currentRows = data._rows;
        currentMonth = data.month;
        renderPreview(data);
        setStatus("Ready to download", "ready");

        // Update dropzone to show file name
        dzText.innerHTML = `<strong>${file.name}</strong> — loaded successfully ✓`;
        dzIcon.innerHTML = `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.5">
          <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>
        </svg>`;
        dropzone.classList.add("dz-success");

      } catch (err) {
        showError("Network error — is the server running?");
        setStatus("Error", "error");
      } finally {
        hideLoading();
      }
    }

    function renderPreview(data) {
      monthLabel.textContent = data.month;
      riderCount.textContent = data.total_riders;
      tableBody.innerHTML = "";

      data.rows.forEach((row) => {
        const seg = SEG_STYLE[row.segment] || { bg: "#6b7280", fg: "#fff" };
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="td-center">${row.sr}</td>
          <td class="td-center td-id">${row.rider_id}</td>
          <td class="td-name" dir="rtl">${row.name}</td>
          <td class="td-center">${row.orders}</td>
          <td class="td-center">${row.on_time}</td>
          <td class="td-center td-percent">${row.percent}</td>
          <td class="td-center">
            <span class="seg-badge" style="background:${seg.bg};color:${seg.fg}">
              ${row.segment}
            </span>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      previewSec.classList.remove("hidden");
      downloadBtn.disabled = false;

      // Smooth scroll to preview
      setTimeout(() => previewSec.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
    }

    // ── Download PDF ───────────────────────────────────────────────────────────
    downloadBtn.addEventListener("click", async () => {
      if (!currentRows) return;
      showLoading("Generating PDF…");
      downloadBtn.disabled = true;

      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ month: currentMonth, rows: currentRows }),
        });

        if (!res.ok) {
          const err = await res.json();
          showError(err.detail || "PDF generation failed.");
          setStatus("Error", "error");
          return;
        }

        const blob = await res.blob();
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        const cd   = res.headers.get("content-disposition") || "";
        const match = cd.match(/filename="?([^"]+)"?/);
        a.href     = url;
        a.download = match ? match[1] : `3PL_Report_${currentMonth.replace(" ", "_")}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        setStatus("Downloaded ✓", "ready");
      } catch (err) {
        showError("Download failed — network error.");
        setStatus("Error", "error");
      } finally {
        hideLoading();
        downloadBtn.disabled = false;
      }
    });

    // ── UI helpers ─────────────────────────────────────────────────────────────
    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.remove("hidden");
    }
    function hideError() {
      errorBox.classList.add("hidden");
    }
    function showLoading(msg) {
      loadText.textContent = msg;
      loadOverlay.classList.remove("hidden");
    }
    function hideLoading() {
      loadOverlay.classList.add("hidden");
    }
    function setStatus(text, type) {
      badgeText.textContent = text;
      badgeDot.className = `badge-dot badge-dot--${type}`;
    }
  </script>
</body>
</html>
